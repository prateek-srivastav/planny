[project]
name = "planny"
version = "0.1.0"
description = "Multi-agent AI travel planner with human-in-the-loop approval (LangGraph + FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-openai>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "sse-starlette>=2.1",
  "langchain-openrouter>=0.2.9",
  "langchain-groq>=1.1.3",
  "langchain-google-genai>=4.4.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:`durability` has no effect:UserWarning",
  "error:Deserializing unregistered type",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
